[project]
name = "pyflecs"
version = "0.1.0"
description = "A python binding for flecs using ctypes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["scikit-build-core>=0.11,<0.12"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/pyflecs"]
wheel.py-api = "py3"
sdist.include = ["vendor/flecs/**", "tools/**", "tests/**", "examples/**", "CMakeLists.txt"]
sdist.exclude = ["src/pyflecs/*.dylib", "src/pyflecs/*.so", "src/pyflecs/*.dll"]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ctypesgen==1.1.1",
    "ruff==0.12.4",
]
